name: DataEase Build and Deploy

on:
  push:
    branches: [ v2.10 ]
  workflow_dispatch:

env:
  # 阿里云镜像仓库配置
  ALIYUN_REGISTRY: crpi-j26ekkvg54ayt5yo.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_REPO: zjj-test/dataease
  VERSION: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. 缓存 Maven 依赖
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # 4. 在根目录 (dataease) 执行 Maven install
      - name: Build root module
        run: mvn clean install -Dmaven.test.skip=true

      # 5. 在 core 子目录执行 Maven package
      - name: Build core module
        working-directory: core
        run: mvn clean package -Pstandalone -U -Dmaven.test.skip=true

      # 6. 登录阿里云镜像仓库
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 7. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # 使用根目录 (dataease) 作为构建上下文
          file: ./Dockerfile  # 显式指定 Dockerfile 路径
          push: true
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.VERSION }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.IMAGE_REPO }}:v2_10
          build-args: |
            JAR_FILE=core/core-backend/target/*.jar
